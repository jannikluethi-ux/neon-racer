name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pin Node 22 so CI and local checks use the same runtime.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Lockfile-exact install. devDependencies are present in CI (unlike
      # deploy), so tsx and playwright are available to the checks below.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:game
      - run: npm run build
